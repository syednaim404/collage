<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>নোটিশ বোর্ড</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Hind Siliguri', 'Noto Sans Bengali', sans-serif; }
    .col-no  { width: 90px; }
    .col-date { width: 220px; }
    .col-pdf { width: 110px; }
  </style>
</head>
<body class="bg-light">

<section class="py-5">
  <div class="container">

    <h2 class="display-6 fw-bold mb-4">সর্বশেষ নোটিশ</h2>

    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr class="fs-5">
              <th class="col-no ps-4 py-3">ক্রম</th>
              <th class="py-3">শিরোনাম</th>
              <th class="col-date py-3">তারিখ</th>
              <th class="col-pdf py-3">PDF</th>
            </tr>
          </thead>
          <tbody>
            <!-- One notice = one <tr>. Copy this row to add more. -->
            <tr>
              <td class="ps-4 py-3 fs-5">১</td>
              <td class="py-3">
                <a href="#" class="fs-5 text-decoration-none">ভর্তি বিজ্ঞপ্তি ২০২৬</a>
                <span class="badge text-bg-danger ms-2">New</span> <!-- delete on older notices -->
              </td>
              <td class="py-3 text-secondary">১৪ অক্টোবর ২০২৬</td>
              <td class="py-3">
                <a href="notice.pdf" download class="btn btn-light text-danger fs-4 py-1"
                   aria-label="ভর্তি বিজ্ঞপ্তি ২০২৬ PDF ডাউনলোড">
                  <i class="bi bi-file-earmark-pdf"></i>
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <a href="#" class="btn btn-link text-decoration-none fw-semibold mt-3 px-0">সব নোটিশ দেখুন →</a>

  </div>
</section>

</body>
</html>
